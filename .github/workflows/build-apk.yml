name: Build Yasem APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check and Extract ZIP project if present
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE" -d extracted_project
            if [ -f "extracted_project/gradlew" ]; then
              cp -rn extracted_project/* .
            else
              SUBDIR=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$SUBDIR" ] && [ -f "$SUBDIR/gradlew" ]; then
                cp -rn $SUBDIR/* .
              fi
            fi
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yasem-App-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            
