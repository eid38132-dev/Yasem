name: Build Yasem APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Yasem project
        run: |
          rm -rf android-project
          unzip -q "YasemAndroid-v1.0-GitHub-Actions.zip" -d android-project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Force Java and Kotlin to JVM 17
        run: |
          APP="android-project/app/build.gradle.kts"

          if [ ! -f "$APP" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            find android-project -maxdepth 4 -type f | sort
            exit 1
          fi

          cat >> "$APP" <<'EOF'

          // CI FIX: Force Java and Kotlin to JVM 17
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "JVM 17 configuration added successfully."

      - name: Show Android project
        run: |
          echo "===== Android project ====="
          find android-project -maxdepth 3 -type f | sort

      - name: Build Debug APK
        run: |
          cd android-project

          set +e

          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee ../build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "          BUILD ERROR SUMMARY"
          echo "========================================"

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "Build failed. Important error lines:"
            echo ""

            grep -nEi \
              "What went wrong|Execution failed|e: |error:|Caused by:|FAILURE:" \
              ../build.log | tail -80 || true

            echo ""
            echo "========================================"
          else
            echo "BUILD SUCCESSFUL"
          fi

          exit "$STATUS"

      - name: Find APK
        if: success()
        run: |
          echo "Searching for APK..."
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Yasem-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yasem-build-log
          path: build.log
          if-no-files-found: ignore
