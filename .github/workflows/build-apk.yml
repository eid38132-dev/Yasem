name: Build Yasem APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Yasem project
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name 'YasemAndroid-v1.0-GitHub-Actions*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Yasem project ZIP not found"
            exit 1
          fi
          rm -rf build-src
          mkdir build-src
          unzip -q "$ZIP" -d build-src
          test -f build-src/settings.gradle.kts
          test -d build-src/app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: build-src
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yasem-debug-apk
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
